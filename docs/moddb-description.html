<h2 style="text-align: center;">Inventory Particles</h2>
<p style="text-align: center;"><strong>Items in your inventory come alive with particles.</strong></p>
<p style="text-align: center;">Hover, pick up or hold an item: torches burn, hot metal sparks, food steams, buckets drip, jewelry glitters, bees buzz around the skep.</p>
<p style="text-align: center;"><em>Client-side only. No server install needed.</em></p>
